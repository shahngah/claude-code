concurrency: name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      isu : baca
      id-token : tulis
    langkah-langkah :
      - nama : Repositori pembayaran
        kegunaan : tindakan/pemeriksaan@11bd71901bbe5b1630ceea73d27597364c9af683   # v4
        dengan :
          kedalaman pengambilan : 1

      - nama : Jalankan Kod Claude
        id : claude
        kegunaan : antropics/claude-code-action@v1
        dengan :
          kunci_api_antropik : $ { { rahsia.KUNCI_API_ANTHROPIK } }
          claude_args: "--model claude-sonnet-4-5-20250929"

